[server]
bind       = "0.0.0.0:3000"
grpc_bind  = "0.0.0.0:41337"
public_url = "grpc://localhost:41337"

[database]
url             = "postgres://lorevault:lorevault@localhost/lorevault"
max_connections = 10

[redis]
url = "redis://localhost:6379"

[auth]
jwt_secret  = "change-me-in-production"
jwt_ttl_secs = 86400  # 24 hours

[storage]
# s3_endpoint is only set for local dev (MinIO). Leave unset in production to use native AWS S3.
s3_bucket   = "lorevault"
s3_region   = "us-east-1"
