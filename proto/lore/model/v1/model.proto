syntax = "proto3";

package lore.model.v1;

// Storage fragment header — describes a unit of content-addressed payload
// returned from the storage layer.
message Fragment {
  uint32 flags = 1;
  uint32 size_payload = 2;
  uint64 size_content = 3;
}

// Content-addressed handle for a stored object.
message Address {
  bytes hash = 1;
  bytes context = 2;
}

// Result of a fragment lookup against the storage layer.
enum FragmentState {
  FOUND_IN_CONTEXT = 0;
  FOUND = 1;
  NOT_FOUND = 2;
  UNKNOWN = 3;
}

// Anchor identifying a specific revision on a specific branch by content
// signature. Used in Branch.stack (ancestry chain) and in any context where
// the revision must be concrete (e.g. BranchCreate's caller-supplied stack).
message BranchPoint {
  bytes branch_id = 1;
  bytes revision_signature = 2;
}

// Request-time specifier for a revision.
message RevisionIdentifier {
  bytes branch_id = 1;
  uint64 number = 2;
}

// Lean projection of a revision used in list responses.
message RevisionItem {
  uint64 number = 1;
  bytes signature = 2;
  bytes metadata = 3;
  bytes state = 4;
}

// A repository — the top-level container for a revision graph.
message Repository {
  bytes id = 1;
  string name = 2;
  string description = 3;
  bytes default_branch_id = 4;
  string default_branch_name = 5;
  string creator = 6;
  uint64 created = 7;
  bytes metadata = 8;
}

// A branch in the revision graph.
message Branch {
  bytes id = 1;
  string name = 2;
  string creator = 3;
  string category = 4;
  uint64 created = 5;
  bytes latest = 6;
  bool deleted = 7;
  bytes metadata = 8;
  repeated BranchPoint stack = 9;
}
