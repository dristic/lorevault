[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.2"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# apple-darwin targets are dropped for now: dist refuses to cross-compile them
# from a non-macOS runner, and we have no GitHub-hosted macOS runner minutes
# or self-hosted Mac hardware. Add them back once runner access exists.
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

[dist.dependencies.apt]
protobuf-compiler = '*'

[dist.dependencies.chocolatey]
protoc = '*'
