[workspace]
members = [
    "crates/lv-core",
    "crates/lv-auth",
    "crates/lv-storage",
    "crates/lv-gateway",
    "crates/lv-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["LoreVault Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP / gRPC
axum = { version = "0.8", features = ["macros"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-build = { version = "0.14" }
tonic-prost = { version = "0.14" }
tonic-prost-build = { version = "0.14" }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
hyper = { version = "1" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
prost-types = "0.14"
tokio-stream = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "any", "uuid", "time", "json"] }

# Auth
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"

# Config
config = { version = "0.14", features = ["toml"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
bytes = "1"
futures = "0.3"
async-trait = "0.1"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
